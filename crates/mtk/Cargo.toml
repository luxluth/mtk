[package]
name = "mtk-rs"
version = "0.1.0-beta.1"
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
name = "mtk"
path = "src/lib.rs"

[dependencies]
bytemuck = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
parley = { workspace = true }
pollster = { workspace = true }
resvg = { workspace = true }
swash = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
zune-image = { workspace = true }
zune-core.workspace = true
arboard = { workspace = true }
mtk-macro = { path = "../mtk-macro", version = "0.1.0-beta.1" }
ratatui = { version = "0.30.2", optional = true }
crossterm = { version = "0.29.0", optional = true }
polars = { version = "0.55.2", optional = true, features = ["lazy", "strings"] }

[build-dependencies]
bindgen = "0.72.1"
cc = "1.4.4"

[features]
default = []
debugger = ["dep:ratatui", "dep:crossterm"]
ratatui = ["dep:ratatui"]
crossterm = ["dep:crossterm"]
polars-demo = ["dep:polars"]

[[example]]
name = "virtual_list_polars_demo"
required-features = ["polars-demo"]

[package]
name = "mtk-rs"
version = "0.1.0-beta.2"
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
name = "mtk"
path = "src/lib.rs"

[dependencies]
bytemuck = { workspace = true }
env_logger = { workspace = true }
parley = { workspace = true }
pollster = { workspace = true }
resvg = { workspace = true }
swash = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
zune-image = { workspace = true }
zune-core.workspace = true
arboard = { workspace = true }
accesskit = { workspace = true }
mtk-layout = { path = "../mtk-layout", version = "0.1.0-beta.2" }
mtk-macro = { path = "../mtk-macro", version = "0.1.0-beta.2" }
ratatui = { version = "0.30.2", optional = true }
crossterm = { version = "0.29.0", optional = true }
polars = { version = "0.55.2", optional = true, features = ["lazy", "strings"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
accesskit_unix = { version = "0.23.0", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "0.35.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.27.0", optional = true }

[features]
default = ["accessibility"]
accessibility = [
    "dep:accesskit_unix",
    "dep:accesskit_windows",
    "dep:accesskit_macos",
]
debugger = ["dep:ratatui", "dep:crossterm"]
ratatui = ["dep:ratatui"]
crossterm = ["dep:crossterm"]
polars-demo = ["dep:polars"]

[[example]]
name = "virtual_list_polars_demo"
required-features = ["polars-demo"]

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["luxluth <delphin.blehoussi93@gmail.com>"]
description = "Muse Toolkit"
license = "MPL-2.0"
repository = "https://github.com/luxluth/mtk"
categories = ["gui", "graphics"]

[workspace.dependencies]
bytemuck = "1.25"
env_logger = "0.11"
parley = { version = "0.12.0", features = ["complex-scripts"] }
pollster = "1"
resvg = "0.49.0"
swash = "0.2.10"
wgpu = "30.0.1"
winit = "=0.31.0-beta.4"
zune-image = "0.5"
zune-core = "0.5"
accesskit = "0.25.2"
hashbrown = "0.17.1"
smol_str = "0.3.7"

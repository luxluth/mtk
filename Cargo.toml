[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["luxluth <delphin.blehoussi93@gmail.com>"]
description = "Muse GUI Toolkit"

[workspace.dependencies]
bytemuck = "1.25"
env_logger = "0.11"
log = "0.4.33"
parley = { version = "0.11.1", features = ["complex-scripts"] }
pollster = "1"
resvg = "0.48.1"
swash = "0.2.10"
wgpu = "30.0.1"
winit = "0.30.13"
zune-image = "0.5"
zune-core = "0.5"
arboard = { version = "3", features = ["wayland-data-control"] }
